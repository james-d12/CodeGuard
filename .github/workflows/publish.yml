name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # enable GitHub OIDC token issuance for NuGet Trusted Publishing
      contents: write # required for `gh release create`

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs full tag history to compute the package version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Dotnet Tools
        run: dotnet tool restore

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore -c Release

      - name: Run Tests
        run: dotnet test --no-build -c Release

      - name: Pack Rules-Engine Tool Package
        run: dotnet pack src/RulesEngine.Cli/RulesEngine.Cli.csproj -c Release -o ./nupkg --no-build

      - name: Verify Package Contains No Rule-Authoring Content
        run: ./scripts/verify-nupkg-contents.sh ./nupkg/*.nupkg

      - name: Get Token
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push Package To NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" ./nupkg/*.nupkg \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease_flag
