id: SKILL-APPHOST-INTERNAL-HTTP-ONLY-001
name: Internal service-to-service uses http scheme
description: >
  Always use the http scheme between internal AppHost-managed services; https
  is reserved for external endpoints.
severity: info
enforcement:
  classification: deterministic
tags:
  - aspire
remediation: >
  Change the WithReference/WithEnvironment URL between internal services to
  use the http scheme instead of https.
illustrative: true

target:
  kind: file
  path: "*/AppHost/Program.cs"

assertions:
  - must_not_match_content:
      pattern: "(?s)WithReference\\([^)]*https://"

tests:
  - name: Internal service reference using http scheme
    setup:
      files:
        - path: src/AppHost/Program.cs
          content: >
            builder.AddProject("api").WithReference(cache).WithEnvironment("INTERNAL_URL", "http://internal-service");
    expect: pass

  - name: Internal service reference using https scheme
    setup:
      files:
        - path: src/AppHost/Program.cs
          content: >
            builder.AddProject("api").WithReference(cache, "https://internal-service");
    expect: fail
