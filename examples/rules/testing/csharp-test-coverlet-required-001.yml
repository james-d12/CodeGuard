id: CSHARP-TEST-COVERLET-REQUIRED-001
name: coverlet.msbuild mandatory in test projects
description: >
  Every test project must reference coverlet.msbuild so coverage is collected
  during the standard build/test pipeline.
severity: warning
enforcement:
  classification: deterministic
tags:
  - testing
  - coverage
remediation: >
  Add a PackageReference to coverlet.msbuild in the test project's .csproj.
illustrative: true

target:
  kind: project
  name: "*.Tests"

assertions:
  - must_reference_package:
      id: "coverlet.msbuild"

tests:
  - name: Test project referencing coverlet.msbuild
    setup:
      projects:
        - name: Contoso.Domain.Tests
          packageReferences:
            - id: coverlet.msbuild
              version: "6.0.0"
    expect: pass

  - name: Test project missing coverlet.msbuild
    setup:
      projects:
        - name: Contoso.Domain.Tests
    expect: fail
versionFingerprint: sha256:7b1681cb97387ca666ea9a3444db237cade3646bc30d71760b7fb943b02d514d
