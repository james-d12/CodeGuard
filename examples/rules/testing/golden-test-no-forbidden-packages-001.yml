id: GOLDEN-TEST-NO-FORBIDDEN-PACKAGES-001
name: xUnit only, no FluentAssertions/Moq/NSubstitute
description: >
  Test projects use xUnit only; FluentAssertions, Moq, and NSubstitute are
  forbidden - hand-crafted test doubles and xUnit's built-in Assert are required.
severity: critical
enforcement:
  classification: deterministic
tags:
  - testing
remediation: >
  Remove the FluentAssertions/Moq/NSubstitute PackageReference and replace with
  hand-crafted test doubles and xUnit's built-in Assert.
illustrative: true

target:
  kind: project
  name: "*.Tests"

assertions:
  - must_not_reference_package:
      id: "FluentAssertions"
  - must_not_reference_package:
      id: "Moq"
  - must_not_reference_package:
      id: "NSubstitute"

tests:
  - name: Test project with no forbidden packages
    setup:
      projects:
        - name: Contoso.Domain.Tests
          packageReferences:
            - id: xunit
              version: "2.9.0"
    expect: pass

  - name: Test project referencing FluentAssertions
    setup:
      projects:
        - name: Contoso.Domain.Tests
          packageReferences:
            - id: FluentAssertions
              version: "6.12.0"
    expect: fail
versionFingerprint: sha256:5630a2bd99d2c788f2aff4a79f65b2ad6043bda4bcea6d0e457e8ffa56925d93
