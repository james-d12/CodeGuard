id: CSHARP-TEST-NO-MOCKING-FRAMEWORKS-001
name: xUnit only, no mocking frameworks in tests
description: >
  Test projects must use xUnit and must not reference Moq, NSubstitute, or
  FluentAssertions - hand-crafted test doubles and plain xUnit assertions are
  required instead.
severity: critical
enforcement:
  classification: deterministic
tags:
  - testing
remediation: >
  Replace mocking-framework/FluentAssertions usage with hand-crafted test doubles
  (see the Doubles/ folder convention) and xUnit's built-in Assert.
illustrative: true

target:
  kind: project
  name: "*.Tests"

assertions:
  - must_reference_package:
      id: "xunit"
  - must_not_reference_package:
      id: "Moq"
  - must_not_reference_package:
      id: "NSubstitute"
  - must_not_reference_package:
      id: "FluentAssertions"

tests:
  - name: Test project using only xUnit
    setup:
      projects:
        - name: Contoso.Domain.Tests
          packageReferences:
            - id: xunit
              version: "2.9.0"
    expect: pass

  - name: Test project referencing Moq
    setup:
      projects:
        - name: Contoso.Domain.Tests
          packageReferences:
            - id: xunit
              version: "2.9.0"
            - id: Moq
              version: "4.20.0"
    expect: fail
