id: SKILL-APPLICATION-NO-RAW-HTTPCLIENT-001
name: No raw HttpClient in application HTTP calls
description: >
  Application-layer HTTP calls must use IHttpRequestSender/HttpRequestBuilder,
  never raw HttpClient. Doesn't verify the mandatory
  retry+circuit-breaker+timeout policy configuration (that needs fluent-chain
  argument analysis beyond a simple call-site check).
severity: error
enforcement:
  classification: deterministic
tags:
  - http
remediation: >
  Replace the raw HttpClient with an IHttpRequestSender/HttpRequestBuilder
  typed client.
illustrative: true

target:
  kind: repository

assertions:
  - must_not_exist:
      selector:
        kind: call_site
        site_kind: object_creation
        invoked_member: "HttpClient"
        project: "*.Application*"

tests:
  - name: Application layer using IHttpRequestSender instead of raw HttpClient
    setup:
      callSites:
        - kind: invocation
          invokedMember: SendAsync
          project: Contoso.Application
    expect: pass

  - name: Application layer instantiating a raw HttpClient
    setup:
      callSites:
        - kind: object_creation
          invokedMember: HttpClient
          project: Contoso.Application
    expect: fail
