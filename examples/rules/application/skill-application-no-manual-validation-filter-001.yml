id: SKILL-APPLICATION-NO-MANUAL-VALIDATION-FILTER-001
name: No manual validation filter re-implementing built-in validation
description: >
  Custom IEndpointFilter implementations must not call
  Validator.TryValidateObject - use built-in Minimal API validation instead.
severity: warning
enforcement:
  classification: deterministic
tags:
  - validation
remediation: >
  Delete the custom IEndpointFilter and rely on builder.Services.AddValidation()
  instead.
illustrative: true

target:
  kind: implements
  interface: "*IEndpointFilter"

assertions:
  - must_not_exist:
      selector:
        kind: call_site
        containing_type: "${FullName}"
        invoked_member: "TryValidateObject"

tests:
  - name: Endpoint filter not calling TryValidateObject
    setup:
      types:
        - name: CustomFilter
          namespace: Contoso.Api.Filters
          interfaces: [Microsoft.AspNetCore.Http.IEndpointFilter]
      callSites:
        - invokedMember: InvokeAsync
          containingType: Contoso.Api.Filters.CustomFilter
    expect: pass

  - name: Endpoint filter manually calling TryValidateObject
    setup:
      types:
        - name: CustomFilter
          namespace: Contoso.Api.Filters
          interfaces: [Microsoft.AspNetCore.Http.IEndpointFilter]
      callSites:
        - invokedMember: TryValidateObject
          containingType: Contoso.Api.Filters.CustomFilter
    expect: fail
