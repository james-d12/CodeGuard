id: SKILL-APPLICATION-LOGGERMESSAGE-PARTIALS-001
name: Structured logs use LoggerMessage partials
description: >
  Structured logs must use [LoggerMessage] source-generated partial methods,
  not ad hoc logger.LogInformation/LogWarning/LogError interpolation.
severity: warning
enforcement:
  classification: deterministic
tags:
  - logging
remediation: >
  Replace the direct logger.Log*(...) call with a [LoggerMessage] partial
  method.
illustrative: true

target:
  kind: repository

assertions:
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "LogInformation"
        project: "*.Application*"
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "LogWarning"
        project: "*.Application*"
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "LogError"
        project: "*.Application*"

tests:
  - name: Application project with no ad hoc logger calls
    setup:
      callSites:
        - invokedMember: LogInformation
          project: Contoso.Infrastructure
    expect: pass

  - name: Application project calling logger.LogInformation directly
    setup:
      callSites:
        - invokedMember: LogInformation
          project: Contoso.Application
    expect: fail
versionFingerprint: sha256:7362e6f77baf78dde10179e48dac4423e13ed67886f97458a0da21d2201f4275
