id: GOLDEN-REPO-SLNX-PREFERRED-001
name: Prefer .slnx over .sln
description: >
  Solutions should use .slnx; if a .slnx file exists, no .sln file may also
  be present.
severity: warning
enforcement:
  classification: deterministic
tags:
  - structure
remediation: >
  Delete the legacy .sln file once the .slnx file is in place.
illustrative: true

target:
  kind: repository

when:
  must_have_file:
    path: "*.slnx"

assertions:
  - must_not_have_file:
      path: "*.sln"

tests:
  - name: slnx present without a legacy sln file
    setup:
      files:
        - path: "Contoso.slnx"
    expect: pass

  - name: slnx present alongside a legacy sln file
    setup:
      files:
        - path: "Contoso.slnx"
        - path: "Contoso.sln"
    expect: fail
