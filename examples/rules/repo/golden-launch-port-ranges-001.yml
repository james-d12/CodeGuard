id: GOLDEN-LAUNCH-PORT-RANGES-001
name: Port assignment ranges by service type
description: >
  applicationUrl ports declared in launchSettings.json must fall within the
  documented overall HTTP port range (5000-7999).
severity: info
enforcement:
  classification: deterministic
tags:
  - configuration
remediation: >
  Change the applicationUrl port(s) to fall within the documented range for the service's role.
illustrative: true

target:
  kind: file
  path: "*/Properties/launchSettings.json"

assertions:
  - must_match_content:
      pattern: "\"applicationUrl\":\\s*\"https?://localhost:[57][0-9]{3}"

tests:
  - name: applicationUrl port within the documented range
    setup:
      files:
        - path: "src/Api/Properties/launchSettings.json"
          content: '{"profiles": {"https": {"applicationUrl": "https://localhost:5001"}}}'
    expect: pass

  - name: applicationUrl port outside the documented range
    setup:
      files:
        - path: "src/Api/Properties/launchSettings.json"
          content: '{"profiles": {"https": {"applicationUrl": "https://localhost:8080"}}}'
    expect: fail
