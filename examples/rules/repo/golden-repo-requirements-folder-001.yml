id: GOLDEN-REPO-REQUIREMENTS-FOLDER-001
name: requirements/ folder per environment
description: >
  The requirements/ folder must contain the standard per-environment
  subfolders (base, dev, sandbox, uat, infrastructure).
severity: warning
enforcement:
  classification: deterministic
tags:
  - structure
remediation: >
  Create the missing environment subfolder under requirements/.
illustrative: true

target:
  kind: repository

assertions:
  - must_have_directory:
      path: "requirements/base"
  - must_have_directory:
      path: "requirements/dev"
  - must_have_directory:
      path: "requirements/sandbox"
  - must_have_directory:
      path: "requirements/uat"
  - must_have_directory:
      path: "requirements/infrastructure"

tests:
  - name: All required environment subfolders present
    setup:
      directories:
        - "requirements/base"
        - "requirements/dev"
        - "requirements/sandbox"
        - "requirements/uat"
        - "requirements/infrastructure"
    expect: pass

  - name: Missing the infrastructure subfolder
    setup:
      directories:
        - "requirements/base"
        - "requirements/dev"
        - "requirements/sandbox"
        - "requirements/uat"
    expect: fail
versionFingerprint: sha256:2b602ff47303eec158947fff8248edebd163240453cfc0f4631a96e45f2baa2c
