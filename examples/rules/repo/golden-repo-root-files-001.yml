id: GOLDEN-REPO-ROOT-FILES-001
name: Mandatory root files
description: >
  The repository root must contain azure-pipelines.yaml, azure-pipelines-pr.yaml,
  .editorconfig, .gitignore, and README.md.
severity: error
enforcement:
  classification: deterministic
tags:
  - structure
remediation: >
  Add the missing root file.
illustrative: true

target:
  kind: repository

assertions:
  - must_have_file:
      path: "azure-pipelines.yaml"
  - must_have_file:
      path: "azure-pipelines-pr.yaml"
  - must_have_file:
      path: ".editorconfig"
  - must_have_file:
      path: ".gitignore"
  - must_have_file:
      path: "README.md"

tests:
  - name: All mandatory root files present
    setup:
      files:
        - path: "azure-pipelines.yaml"
        - path: "azure-pipelines-pr.yaml"
        - path: ".editorconfig"
        - path: ".gitignore"
        - path: "README.md"
    expect: pass

  - name: Missing README.md at the repository root
    setup:
      files:
        - path: "azure-pipelines.yaml"
        - path: "azure-pipelines-pr.yaml"
        - path: ".editorconfig"
        - path: ".gitignore"
    expect: fail
