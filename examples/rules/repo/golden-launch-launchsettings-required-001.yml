id: GOLDEN-LAUNCH-LAUNCHSETTINGS-REQUIRED-001
name: launchSettings.json required per application project
description: >
  Properties/launchSettings.json must exist for every application project with
  http and https profiles and ASPNETCORE_ENVIRONMENT=Development.
severity: warning
enforcement:
  classification: deterministic
tags:
  - configuration
remediation: >
  Add Properties/launchSettings.json with http/https profiles and
  ASPNETCORE_ENVIRONMENT=Development in the environmentVariables block.
illustrative: true

target:
  kind: file
  path: "*/Properties/launchSettings.json"

assertions:
  - must_have_json_field:
      path: "profiles.http"
  - must_have_json_field:
      path: "profiles.https"
  - must_have_json_field:
      path: "profiles.https.environmentVariables.ASPNETCORE_ENVIRONMENT"
      equals: "Development"
