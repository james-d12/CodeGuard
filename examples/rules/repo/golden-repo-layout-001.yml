id: GOLDEN-REPO-LAYOUT-001
name: Standard repository layout
description: >
  Repositories must have an src/ folder at the root containing the per-layer
  service projects.
severity: error
enforcement:
  classification: deterministic
tags:
  - structure
remediation: >
  Create the src/ folder at the repository root and move project folders under it.
illustrative: true

target:
  kind: repository

assertions:
  - must_have_directory:
      path: "src"

tests:
  - name: Repository with an src folder at the root
    setup:
      directories:
        - "src"
    expect: pass

  - name: Repository without an src folder
    setup:
      directories:
        - "docs"
    expect: fail
