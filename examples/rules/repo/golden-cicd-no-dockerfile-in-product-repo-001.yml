id: GOLDEN-CICD-NO-DOCKERFILE-IN-PRODUCT-REPO-001
name: Product repos must not contain a Dockerfile
description: >
  Dockerfile ownership belongs to shared pipeline templates; presence in a
  product repo is a violation.
severity: error
enforcement:
  classification: deterministic
tags:
  - cicd
remediation: >
  Remove the Dockerfile from the repository; container build steps belong in
  the shared pipeline templates.
illustrative: true

target:
  kind: repository

assertions:
  - must_not_have_file:
      path: "Dockerfile"

tests:
  - name: Product repo without a Dockerfile
    setup:
      files:
        - path: "azure-pipelines.yaml"
    expect: pass

  - name: Product repo containing a Dockerfile
    setup:
      files:
        - path: "Dockerfile"
    expect: fail
versionFingerprint: sha256:651d86a68bb15f6dfb6a9f332a00785198e396897f7b2648c41d2ac06bd48b58
