id: CODING-HTTP-HTTPCLIENTFACTORY-001
name: Use IHttpClientFactory
description: >
  No `new HttpClient()` instantiation outside DI/factory registration - use
  IHttpClientFactory to reuse HttpClient instances and configure timeouts.
severity: warning
enforcement:
  classification: deterministic
tags:
  - http
remediation: >
  Inject IHttpClientFactory (or a typed client) instead of constructing
  HttpClient directly.
illustrative: true

target:
  kind: repository

assertions:
  - must_not_exist:
      selector:
        kind: call_site
        site_kind: object_creation
        invoked_member: "HttpClient"

tests:
  - name: HttpClient obtained via IHttpClientFactory
    setup:
      callSites:
        - kind: invocation
          invokedMember: CreateClient
          targetTypeName: IHttpClientFactory
    expect: pass

  - name: HttpClient constructed directly
    setup:
      callSites:
        - kind: object_creation
          invokedMember: HttpClient
    expect: fail
versionFingerprint: sha256:2ba60aadea650c1633aad37a6a83ec5bb7c10d2afb010995566a244354a86326
