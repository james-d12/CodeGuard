id: GOLDEN-HTTP-FRAMEWORK-HTTP-ONLY-001
name: Outbound HTTP must use Contoso.Framework.Http
description: >
  Application code must not subclass HttpClient or reimplement a bespoke
  SendRequest wrapper - outbound HTTP must go through Contoso.Framework.Http.
severity: error
enforcement:
  classification: deterministic
tags:
  - http
remediation: >
  Remove the custom HttpClient subclass/wrapper and use Contoso.Framework.Http instead.
illustrative: true

target:
  kind: class
  namespace: "*"

assertions:
  - must_not_inherit_from:
      type: "System.Net.Http.HttpClient"
  - must_not_have_method:
      name: "SendRequest"

tests:
  - name: Typed client uses Contoso.Framework.Http
    setup:
      types:
        - name: OrdersClient
          namespace: Contoso.Orders
          baseType: "Contoso.Framework.Http.TypedHttpClient"
          methods:
            - name: GetOrder
    expect: pass

  - name: Custom client subclasses HttpClient directly
    setup:
      types:
        - name: OrdersClient
          namespace: Contoso.Orders
          baseType: "System.Net.Http.HttpClient"
    expect: fail
