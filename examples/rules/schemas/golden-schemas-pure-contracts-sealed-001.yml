id: GOLDEN-SCHEMAS-PURE-CONTRACTS-SEALED-001
name: Schemas project contracts are sealed records
description: >
  Every type declared in a *.Schemas project must be a sealed record - schemas
  are pure transport contracts, not extensible types.
severity: critical
enforcement:
  classification: deterministic
tags:
  - schemas
remediation: >
  Change the type declaration to `public sealed record`.
illustrative: true

target:
  kind: record
  namespace: "*.Schemas*"

assertions:
  - must_have_modifier:
      modifier: "sealed"

tests:
  - name: Sealed record in a Schemas namespace
    setup:
      types:
        - name: OrderResponse
          kind: record
          namespace: Contoso.Schemas
          modifiers: [sealed]
    expect: pass

  - name: Non-sealed record in a Schemas namespace
    setup:
      types:
        - name: OrderResponse
          kind: record
          namespace: Contoso.Schemas
    expect: fail
versionFingerprint: sha256:3f4c88015c810f1b20a342a0e0d6c014041733d92a4b6ad0dc7c61410fe4e219
