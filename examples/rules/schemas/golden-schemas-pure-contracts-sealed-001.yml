id: GOLDEN-SCHEMAS-PURE-CONTRACTS-SEALED-001
name: Schemas project contracts are sealed records
description: >
  Every type declared in a *.Schemas project must be a sealed record - schemas
  are pure transport contracts, not extensible types.
severity: critical
enforcement:
  classification: deterministic
tags:
  - schemas
remediation: >
  Change the type declaration to `public sealed record`.
illustrative: true

target:
  kind: record
  namespace: "*.Schemas*"

assertions:
  - must_have_modifier:
      modifier: "sealed"
