id: SKILL-APPLICATION-SCHEMA-ATTRIBUTE-RULES-001
name: Application Schemas project has zero package references
description: >
  *.Schemas projects carry pure data-contract records and must have zero
  NuGet package references. (This rule covers the project-reference clause
  only; the per-property required/DataAnnotations rules for request vs.
  response records need per-record-kind scoping not yet expressible as a
  single declarative rule and are left for a future pass.)
severity: critical
enforcement:
  classification: deterministic
tags:
  - schemas
remediation: >
  Remove all PackageReference entries from the *.Schemas project - it must
  depend on nothing beyond the BCL.
illustrative: true

target:
  kind: project
  name: "*.Schemas"

assertions:
  - must_not_reference_package:
      id: "*"
