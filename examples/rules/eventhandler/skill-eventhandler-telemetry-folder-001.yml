id: SKILL-EVENTHANDLER-TELEMETRY-FOLDER-001
name: Shared Telemetry folder with required files
description: >
  A shared Telemetry/ folder must exist containing MetricNames, TagNames, and
  MetricExtensions files.
severity: warning
enforcement:
  classification: deterministic
tags:
  - eventhandler
  - telemetry
remediation: >
  Add the missing MetricNames/TagNames/MetricExtensions file to the shared
  Telemetry/ folder.
illustrative: true

target:
  kind: repository

assertions:
  - must_have_file:
      path: "*/Telemetry/MetricNames.cs"
  - must_have_file:
      path: "*/Telemetry/TagNames.cs"
  - must_have_file:
      path: "*/Telemetry/MetricExtensions.cs"

tests:
  - name: Shared Telemetry folder has all required files
    setup:
      files:
        - path: "Contoso.Shared/Telemetry/MetricNames.cs"
        - path: "Contoso.Shared/Telemetry/TagNames.cs"
        - path: "Contoso.Shared/Telemetry/MetricExtensions.cs"
    expect: pass

  - name: Shared Telemetry folder missing MetricExtensions
    setup:
      files:
        - path: "Contoso.Shared/Telemetry/MetricNames.cs"
        - path: "Contoso.Shared/Telemetry/TagNames.cs"
    expect: fail
