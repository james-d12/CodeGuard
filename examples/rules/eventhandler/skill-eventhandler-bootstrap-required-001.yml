id: SKILL-EVENTHANDLER-BOOTSTRAP-REQUIRED-001
name: EventHandler mandatory ContosoWebApplication bootstrap
description: >
  EventHandler Program.cs must bootstrap via
  ContosoWebApplication.CreateBuilder(...)/BuildApp(...), never the raw
  WebApplication.CreateBuilder(args)/builder.Build().
severity: critical
enforcement:
  classification: deterministic
tags:
  - eventhandler
  - startup
remediation: >
  Replace WebApplication.CreateBuilder(args)/builder.Build() with
  ContosoWebApplication.CreateBuilder(...)/.BuildApp(...).
illustrative: true

target:
  kind: repository

assertions:
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "CreateBuilder"
        target_type: "WebApplication"
        project: "*.EventHandler*"
  - must_exist:
      selector:
        kind: call_site
        invoked_member: "CreateBuilder"
        target_type: "ContosoWebApplication"
        project: "*.EventHandler*"

tests:
  - name: Program.cs bootstraps via ContosoWebApplication
    setup:
      callSites:
        - invokedMember: CreateBuilder
          targetTypeName: ContosoWebApplication
          project: Contoso.Orders.EventHandler.Api
    expect: pass

  - name: Program.cs bootstraps via raw WebApplication
    setup:
      callSites:
        - invokedMember: CreateBuilder
          targetTypeName: WebApplication
          project: Contoso.Orders.EventHandler.Api
        - invokedMember: CreateBuilder
          targetTypeName: ContosoWebApplication
          project: Contoso.Orders.EventHandler.Api
    expect: fail
versionFingerprint: sha256:5f9b3f79025042fdedfe8a4e74da4541d8fca354100212245a44af6a4bf38adf
