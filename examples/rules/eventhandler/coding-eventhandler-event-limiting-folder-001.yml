id: CODING-EVENTHANDLER-EVENT-LIMITING-FOLDER-001
name: EventHandler.Application requires EventLimiting folder
description: >
  *.EventHandler.Application projects must include an EventLimiting/ middleware
  folder.
severity: error
enforcement:
  classification: deterministic
tags:
  - eventhandler
  - structure
remediation: >
  Add an EventLimiting/ folder under the *.EventHandler.Application project
  containing the rate-limiting middleware.
illustrative: true

target:
  kind: repository

assertions:
  - must_have_file:
      path: "*.EventHandler.Application/EventLimiting/*"
