id: DDD-ENTITY-001
name: Domain entities must inherit from Entity
description: >
  All domain entities must inherit from the approved Entity<TId> base class.
severity: error
enforcement:
  classification: deterministic
tags:
  - ddd
  - domain
  - entity
remediation: >
  Inherit from Contoso.Domain.Entity<TId>.
illustrative: true

metadata:
  source:
    document: DDD Standards
    section: Entities
    statement: Every domain entity inherits from the shared Entity<TId> base class.
    file: examples/docs/ddd-standards.md
    fingerprint: sha256:5b1b4e48288337c841fff197c1f348b490296ec620528ef2eebfacedd4768cc6

target:
  kind: class
  namespace: "Contoso.Domain.Entities"

assertions:
  - must_inherit_from:
      type: "Contoso.Domain.Entity<*>"

tests:
  - name: Entity inheriting from Entity<TId>
    setup:
      types:
        - name: Order
          namespace: Contoso.Domain.Entities
          baseType: "Contoso.Domain.Entity<Guid>"
    expect: pass

  - name: Entity not inheriting from Entity<TId>
    setup:
      types:
        - name: LegacyThing
          namespace: Contoso.Domain.Entities
    expect: fail
