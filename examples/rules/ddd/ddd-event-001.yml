id: DDD-EVENT-001
name: Domain events must live in the Domain.Events namespace
description: >
  Types implementing IDomainEvent must be declared in a namespace ending in
  Domain.Events.
severity: error
enforcement:
  classification: deterministic
tags:
  - ddd
  - domain
  - event
remediation: >
  Move the domain event type into a namespace ending in Domain.Events.
illustrative: true

target:
  kind: implements
  interface: "Contoso.Domain.IDomainEvent"

assertions:
  - must_be_in_namespace:
      pattern: "*.Domain.Events"

tests:
  - name: Domain event in the Domain.Events namespace
    setup:
      types:
        - name: OrderPlaced
          namespace: Contoso.Domain.Events
          interfaces: [Contoso.Domain.IDomainEvent]
    expect: pass

  - name: Domain event outside the Domain.Events namespace
    setup:
      types:
        - name: OrderPlaced
          namespace: Contoso.Domain.Entities
          interfaces: [Contoso.Domain.IDomainEvent]
    expect: fail
