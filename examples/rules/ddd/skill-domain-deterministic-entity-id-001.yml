id: SKILL-DOMAIN-DETERMINISTIC-ENTITY-ID-001
name: Entity IDs use GenerateDeterministicId
description: >
  Entity IDs must use GuidGenerator.GenerateDeterministicId, never
  Guid.NewGuid(), for the primary entity ID.
severity: error
enforcement:
  classification: deterministic
tags:
  - domain
remediation: >
  Replace Guid.NewGuid() with GuidGenerator.GenerateDeterministicId(...).
illustrative: true

target:
  kind: repository

assertions:
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "NewGuid"
        target_type: "Guid"
        project: "*.Domain*"

tests:
  - name: Domain project uses GenerateDeterministicId for entity IDs
    setup:
      callSites:
        - invokedMember: GenerateDeterministicId
          targetTypeName: GuidGenerator
          containingType: Contoso.Domain.Order
          project: Contoso.Domain
    expect: pass

  - name: Domain project calls Guid.NewGuid() directly
    setup:
      callSites:
        - invokedMember: NewGuid
          targetTypeName: Guid
          containingType: Contoso.Domain.Order
          project: Contoso.Domain
    expect: fail
