id: DDD-AGGREGATE-002
name: Aggregate roots must expose a Create factory method
description: >
  Aggregate roots must be constructed through a static Create factory method
  rather than directly via their constructor.
severity: warning
enforcement:
  classification: deterministic
tags:
  - ddd
  - domain
  - aggregate
remediation: >
  Add a public static Create method that returns a fully-constructed aggregate.
illustrative: true

target:
  kind: implements
  interface: "Contoso.Domain.IAggregateRoot"

assertions:
  - must_have_method:
      name: "Create"

tests:
  - name: Aggregate root with a Create factory method
    setup:
      types:
        - name: Order
          namespace: Contoso.Domain.Entities
          interfaces: [Contoso.Domain.IAggregateRoot]
          methods:
            - name: Create
    expect: pass

  - name: Aggregate root without a Create factory method
    setup:
      types:
        - name: Order
          namespace: Contoso.Domain.Entities
          interfaces: [Contoso.Domain.IAggregateRoot]
    expect: fail
