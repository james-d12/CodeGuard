id: GOLDEN-ARCH-EVENT-NAMING-001
name: Event naming convention
description: >
  Events named {Entity}{Action}Event.
severity: warning
enforcement:
  classification: deterministic
tags:
  - naming
  - events
remediation: >
  Rename the event record so it ends with "Event" (e.g. OrderPlacedEvent).
illustrative: true

target:
  kind: record
  namespace: "Contoso.Domain.Events"

assertions:
  - must_match_name:
      regex: "^[A-Za-z]+Event$"

tests:
  - name: Event record named with the Event suffix
    setup:
      types:
        - name: OrderPlacedEvent
          namespace: Contoso.Domain.Events
          kind: record
    expect: pass

  - name: Event record missing the Event suffix
    setup:
      types:
        - name: OrderPlaced
          namespace: Contoso.Domain.Events
          kind: record
    expect: fail
versionFingerprint: sha256:4acb8c781ca668c5ca2894a159ba19c006022592c37c5f4d62e5f0bdc1ea6b34
