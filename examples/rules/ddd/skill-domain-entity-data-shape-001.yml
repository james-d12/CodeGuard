id: SKILL-DOMAIN-ENTITY-DATA-SHAPE-001
name: Domain entity data shape
description: >
  *EntityData types must be record with required+init properties, including
  CreatedDateTime and UpdatedDateTime.
severity: error
enforcement:
  classification: deterministic
tags:
  - domain
remediation: >
  Declare the type as a record with CreatedDateTime and UpdatedDateTime
  properties (required init).
illustrative: true

target:
  kind: record
  namespace: "Contoso.Domain.Entities"

when:
  must_match_name:
    regex: ".*EntityData$"

assertions:
  - must_have_property:
      name: "CreatedDateTime"
  - must_have_property:
      name: "UpdatedDateTime"

tests:
  - name: EntityData record has CreatedDateTime and UpdatedDateTime
    setup:
      types:
        - name: OrderEntityData
          namespace: Contoso.Domain.Entities
          kind: record
          properties:
            - name: CreatedDateTime
            - name: UpdatedDateTime
    expect: pass

  - name: EntityData record missing UpdatedDateTime
    setup:
      types:
        - name: OrderEntityData
          namespace: Contoso.Domain.Entities
          kind: record
          properties:
            - name: CreatedDateTime
    expect: fail
