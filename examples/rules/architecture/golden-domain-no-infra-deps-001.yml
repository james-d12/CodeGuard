id: GOLDEN-DOMAIN-NO-INFRA-DEPS-001
name: Domain layer has no infrastructure dependencies
description: >
  Domain source files must not reference HttpClient, Cosmos DB, or SqlConnection
  types - the domain layer must stay persistence- and transport-ignorant.
severity: critical
enforcement:
  classification: deterministic
tags:
  - domain
  - architecture
remediation: >
  Remove the infrastructure using-directive/type reference from the Domain project;
  depend on a Domain-defined abstraction instead.
illustrative: true

target:
  kind: file
  path: "*.Domain/*"
  extension: ".cs"

assertions:
  - must_not_match_content:
      pattern: "using\\s+(System\\.Net\\.Http|Microsoft\\.Azure\\.Cosmos)\\s*;|\\bSqlConnection\\b"

tests:
  - name: Domain file with no infrastructure references
    setup:
      files:
        - path: Contoso.Domain/Order.cs
          content: |
            namespace Contoso.Domain;

            public class Order
            {
            }
    expect: pass

  - name: Domain file using HttpClient's namespace
    setup:
      files:
        - path: Contoso.Domain/Order.cs
          content: |
            using System.Net.Http;

            namespace Contoso.Domain;

            public class Order
            {
            }
    expect: fail
