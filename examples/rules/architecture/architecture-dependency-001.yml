id: ARCH-DEPENDENCY-001
name: Domain projects must not reference Infrastructure projects
description: >
  Domain projects must not take a project reference on an Infrastructure project -
  dependencies must point inward, not outward, per the dependency rule.
severity: critical
enforcement:
  classification: deterministic
tags:
  - architecture
  - ddd
  - layering
remediation: >
  Remove the project reference and depend on an abstraction defined in Domain instead.
illustrative: true

metadata:
  source:
    document: Architecture Standards
    section: Domain Layer
    statement: Domain projects must not take a project reference on an Infrastructure project.
    file: examples/docs/architecture-standards.md
    fingerprint: sha256:368ef7a31ae24b0c79abbc09856a0000e0a5428b08613fa9b86d04af687223b4

target:
  kind: project
  name: "*.Domain"

assertions:
  - must_not_reference_project:
      name: "*.Infrastructure"

tests:
  - name: Domain project without an Infrastructure reference
    setup:
      projects:
        - name: Contoso.Domain
    expect: pass

  - name: Domain project referencing Infrastructure
    setup:
      projects:
        - name: Contoso.Domain
          projectReferences: ["Contoso.Infrastructure"]
    expect: fail
