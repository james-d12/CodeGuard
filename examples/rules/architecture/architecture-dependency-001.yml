id: ARCH-DEPENDENCY-001
name: Domain projects must not reference Infrastructure projects
description: >
  Domain projects must not take a project reference on an Infrastructure project -
  dependencies must point inward, not outward, per the dependency rule.
severity: critical
enforcement:
  classification: deterministic
tags:
  - architecture
  - ddd
  - layering
remediation: >
  Remove the project reference and depend on an abstraction defined in Domain instead.
illustrative: true

target:
  kind: project
  name: "*.Domain"

assertions:
  - must_not_reference_project:
      name: "*.Infrastructure"

tests:
  - name: Domain project without an Infrastructure reference
    setup:
      projects:
        - name: Contoso.Domain
    expect: pass

  - name: Domain project referencing Infrastructure
    setup:
      projects:
        - name: Contoso.Domain
          projectReferences: ["Contoso.Infrastructure"]
    expect: fail
