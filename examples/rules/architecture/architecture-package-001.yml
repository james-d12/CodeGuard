id: ARCH-PACKAGE-001
name: Domain projects must not reference Entity Framework Core directly
description: >
  Domain projects must remain persistence-ignorant; only Infrastructure projects
  may take a direct dependency on Microsoft.EntityFrameworkCore.
severity: error
enforcement:
  classification: deterministic
tags:
  - architecture
  - ddd
  - packages
remediation: >
  Remove the Microsoft.EntityFrameworkCore package reference from the Domain project.
illustrative: true

target:
  kind: project
  name: "*.Domain"

assertions:
  - must_not_reference_package:
      id: "Microsoft.EntityFrameworkCore"

tests:
  - name: Domain project without an Entity Framework Core package reference
    setup:
      projects:
        - name: Contoso.Domain
          packageReferences:
            - id: "Contoso.Framework.DDD.v2"
    expect: pass

  - name: Domain project referencing Entity Framework Core directly
    setup:
      projects:
        - name: Contoso.Domain
          packageReferences:
            - id: "Microsoft.EntityFrameworkCore"
    expect: fail
versionFingerprint: sha256:4a2403db817277ca3e0dbc6c695d2d6c0b96580704aa18cbfabd398933eccdcf
