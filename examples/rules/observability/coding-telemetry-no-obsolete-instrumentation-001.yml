id: CODING-TELEMETRY-NO-OBSOLETE-INSTRUMENTATION-001
name: No obsolete AddFrameworkInstrumentation call
description: >
  Do not use the obsolete AddFrameworkInstrumentation API.
severity: warning
enforcement:
  classification: deterministic
tags:
  - telemetry
remediation: >
  Replace the AddFrameworkInstrumentation call with its documented
  replacement API.
illustrative: true

target:
  kind: repository

assertions:
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "AddFrameworkInstrumentation"

tests:
  - name: Instrumentation wired via the current API
    setup:
      callSites:
        - invokedMember: AddInstrumentation
    expect: pass

  - name: Instrumentation wired via the obsolete API
    setup:
      callSites:
        - invokedMember: AddFrameworkInstrumentation
    expect: fail
