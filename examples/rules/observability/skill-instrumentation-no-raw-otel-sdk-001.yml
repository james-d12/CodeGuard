id: SKILL-INSTRUMENTATION-NO-RAW-OTEL-SDK-001
name: No raw OpenTelemetry SDK wiring
description: >
  Forbids raw OpenTelemetry SDK wiring (new Meter(...), new
  ActivitySource(...), .AddOpenTelemetry().WithTracing(...)) - use framework
  extensions instead. Doesn't exclude Contoso.Framework.Instrumentation itself
  (which legitimately wires the SDK once, centrally).
severity: error
enforcement:
  classification: deterministic
tags:
  - telemetry
remediation: >
  Replace the raw SDK call with the framework's instrumentation extension
  method.
illustrative: true

target:
  kind: repository

assertions:
  - must_not_exist:
      selector:
        kind: call_site
        site_kind: object_creation
        invoked_member: "Meter"
  - must_not_exist:
      selector:
        kind: call_site
        site_kind: object_creation
        invoked_member: "ActivitySource"
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "WithTracing"

tests:
  - name: Instrumentation wired via the framework extension
    setup:
      callSites:
        - kind: invocation
          invokedMember: AddFrameworkInstrumentation
    expect: pass

  - name: Code constructs a raw OpenTelemetry Meter
    setup:
      callSites:
        - kind: object_creation
          invokedMember: Meter
    expect: fail
