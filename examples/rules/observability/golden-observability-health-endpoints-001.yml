id: GOLDEN-OBSERVABILITY-HEALTH-ENDPOINTS-001
name: /health and /ready endpoints required
description: >
  Program.cs must call MapHealthChecks. Approximated as "the call exists
  somewhere in the repository" rather than verifying the literal
  "/health"/"/ready" path arguments.
severity: error
enforcement:
  classification: deterministic
tags:
  - health-checks
remediation: >
  Call app.MapHealthChecks("/health") (and a readiness endpoint) in
  Program.cs.
illustrative: true

target:
  kind: repository

assertions:
  - must_exist:
      selector:
        kind: call_site
        invoked_member: "MapHealthChecks"

tests:
  - name: Program.cs calls MapHealthChecks
    setup:
      callSites:
        - invokedMember: MapHealthChecks
    expect: pass

  - name: Program.cs never calls MapHealthChecks
    setup:
      callSites:
        - invokedMember: UseRouting
    expect: fail
versionFingerprint: sha256:40fcf3f0928525349b0f083131afff9f6590f7edcd58fc2d0917d99719206ded
