id: GOLDEN-STACK-MANDATORY-FRAMEWORK-LIBS-001
name: Mandatory Contoso framework libraries
description: >
  Application projects must reference the mandatory Contoso framework
  libraries for logging, instrumentation, health checks, and HTTP.
severity: warning
enforcement:
  classification: deterministic
tags:
  - packages
remediation: >
  Add the missing Contoso.Framework.* package reference.
illustrative: true

target:
  kind: project
  name: "*.Application"

assertions:
  - must_reference_package:
      id: "Contoso.Framework.Logging.Microsoft"
  - must_reference_package:
      id: "Contoso.Framework.Instrumentation"
  - must_reference_package:
      id: "Contoso.Framework.HealthChecks"
  - must_reference_package:
      id: "Contoso.Framework.Http"
