id: CODING-ASYNC-NO-BLOCKING-CALLS-001
name: No blocking async calls
description: >
  No .Result or .Wait() call sites on Task/Task<T> anywhere in the
  repository. Doesn't cover the "no async void outside designated
  event-handler signatures" clause (that needs a method-signature/attribute
  cross-check this rule doesn't perform).
severity: error
enforcement:
  classification: deterministic
tags:
  - async
remediation: >
  Replace `.Result`/`.Wait()` with `await`.
illustrative: true

target:
  kind: repository

assertions:
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "Result"
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "Wait"

tests:
  - name: Repository with no blocking async call sites
    setup:
      callSites:
        - invokedMember: "GetAwaiter"
    expect: pass

  - name: Repository with a .Result call site
    setup:
      callSites:
        - invokedMember: "Result"
          containingType: Contoso.Domain.OrderService
    expect: fail
versionFingerprint: sha256:13178e07153c1c42cc79cde539bb473a3b8075a9244029a5e6f3eebfb4e2636b
