id: GOLDEN-CSPROJ-TREAT-WARNINGS-AS-ERRORS-001
name: TreatWarningsAsErrors required
description: >
  Every .csproj must set <TreatWarningsAsErrors>true</TreatWarningsAsErrors> so
  compiler warnings fail the build instead of accumulating silently.
severity: error
enforcement:
  classification: deterministic
tags:
  - csproj
remediation: >
  Add <TreatWarningsAsErrors>true</TreatWarningsAsErrors> to the project's <PropertyGroup>.
illustrative: true

target:
  kind: project
  name: "*"

assertions:
  - must_have_msbuild_property:
      name: "TreatWarningsAsErrors"
      value: "true"

tests:
  - name: Project with TreatWarningsAsErrors set to true
    setup:
      projects:
        - name: Contoso.Domain
          properties:
            TreatWarningsAsErrors: "true"
    expect: pass

  - name: Project without TreatWarningsAsErrors set
    setup:
      projects:
        - name: Contoso.Domain
    expect: fail
versionFingerprint: sha256:a3e58cc9bff35652ccbfee0808ec504afb82e518cee30be6d7f4bb0f5c939535
