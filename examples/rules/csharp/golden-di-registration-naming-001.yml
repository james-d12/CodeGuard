id: GOLDEN-DI-REGISTRATION-NAMING-001
name: DI registration extension method naming
description: >
  Public static registration extension methods must be named Add{Feature}, matching
  the standard Microsoft.Extensions.DependencyInjection convention.
severity: info
enforcement:
  classification: deterministic
tags:
  - di
remediation: >
  Rename the extension method to start with "Add" followed by the feature name, e.g. AddOrderProcessing.
illustrative: true

target:
  kind: method
  project: "*"
  is_static: true
  accessibility: public

assertions:
  - must_match_name:
      regex: "^Add[A-Z][A-Za-z0-9]*$"

tests:
  - name: Public static registration method named Add{Feature}
    setup:
      types:
        - name: ServiceCollectionExtensions
          namespace: Contoso.Application
          methods:
            - name: AddOrderProcessing
              modifiers: [static]
              accessibility: public
    expect: pass

  - name: Public static registration method not following the Add{Feature} convention
    setup:
      types:
        - name: ServiceCollectionExtensions
          namespace: Contoso.Application
          methods:
            - name: RegisterOrderProcessing
              modifiers: [static]
              accessibility: public
    expect: fail
