id: CODING-DI-CONSTRUCTOR-INJECTION-ONLY-001
name: No service-locator pattern
description: >
  No calls to IServiceProvider.GetService/GetRequiredService outside DI
  extension methods. Doesn't cover the "constructor parameter count < 5" or
  "dependencies stored in readonly fields" clauses (those are structural,
  per-candidate checks a future rule could add via must_have_parameter_count
  and a field-modifier check respectively - this rule covers only the
  call-site half).
severity: warning
enforcement:
  classification: deterministic
tags:
  - di
remediation: >
  Inject the dependency through the constructor instead of resolving it via
  IServiceProvider.GetService/GetRequiredService.
illustrative: true

metadata:
  source:
    document: C# Conventions
    section: Dependency Injection
    statement: Dependencies are injected through the constructor, not resolved via the service-locator pattern.
    file: examples/docs/csharp-conventions.md
    fingerprint: sha256:59c5051a8b276bb89e88928cd2f6bdd7e717899d6016ebd088d071704000809d

target:
  kind: repository

assertions:
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "GetService"
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "GetRequiredService"

tests:
  - name: Repository with no service-locator call sites
    setup:
      callSites:
        - invokedMember: "AddSingleton"
    expect: pass

  - name: Repository resolving a dependency via GetRequiredService
    setup:
      callSites:
        - invokedMember: "GetRequiredService"
          containingType: Contoso.Api.OrderController
    expect: fail
versionFingerprint: sha256:b24b23cf03b9db7701eca582f56dd4ae1e8895e34a161fb4f844d8bfa044cd56
