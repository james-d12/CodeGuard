id: CSHARP-NAMESPACE-001
name: All types must live under the Contoso namespace root
description: >
  Every type in the codebase must be declared under the Contoso.* namespace root.
severity: warning
enforcement:
  classification: deterministic
tags:
  - csharp
  - namespace
remediation: >
  Move the type into a namespace rooted at Contoso.
illustrative: true

target:
  kind: type
  namespace: "*"

assertions:
  - must_be_in_namespace:
      pattern: "Contoso.*"

tests:
  - name: Type declared under the Contoso namespace root
    setup:
      types:
        - name: Order
          namespace: Contoso.Domain.Entities
    expect: pass

  - name: Type declared outside the Contoso namespace root
    setup:
      types:
        - name: Order
          namespace: Acme.Domain.Entities
    expect: fail
