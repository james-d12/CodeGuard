id: CODING-TYPE-NULLABLE-ENABLED-001
name: Nullable reference types enabled
description: >
  <Nullable>enable</Nullable> required in all projects.
severity: error
enforcement:
  classification: deterministic
tags:
  - nullability
  - csproj
remediation: >
  Add <Nullable>enable</Nullable> to the project's .csproj.
illustrative: true

target:
  kind: project
  name: "*"

assertions:
  - must_have_msbuild_property:
      name: "Nullable"
      value: "enable"

tests:
  - name: Project with nullable reference types enabled
    setup:
      projects:
        - name: Contoso.Domain
          properties:
            Nullable: "enable"
    expect: pass

  - name: Project without the Nullable property set
    setup:
      projects:
        - name: Contoso.Domain
          properties:
            Nullable: "disable"
    expect: fail
