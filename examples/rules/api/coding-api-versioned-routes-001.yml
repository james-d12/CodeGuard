id: CODING-API-VERSIONED-ROUTES-001
name: API routes versioned in URL path
description: >
  API versioning appears in the URL path, e.g. /v1/... or /api/v1/....
severity: warning
enforcement:
  classification: deterministic
tags:
  - api
remediation: >
  Prefix the route template with /v{n}/ or /api/v{n}/.
illustrative: true

target:
  kind: call_site
  invoked_member: "Map*"

assertions:
  - must_match_argument:
      index: 0
      pattern: "^/(api/)?v[0-9]+/"

tests:
  - name: Route mapped with a versioned path
    setup:
      callSites:
        - invokedMember: MapGet
          arguments:
            - index: 0
              literalValue: "/api/v1/orders"
              isLiteral: true
    expect: pass

  - name: Route mapped without a versioned path
    setup:
      callSites:
        - invokedMember: MapGet
          arguments:
            - index: 0
              literalValue: "/orders"
              isLiteral: true
    expect: fail
versionFingerprint: sha256:6142d60449cf3de5bf901d2a936e6564c8fa88b15d50f71459975490b89176f2
