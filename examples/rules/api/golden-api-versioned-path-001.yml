id: GOLDEN-API-VERSIONED-PATH-001
name: Routes versioned /api/v{version}/{resource}
description: >
  Routes follow /api/v{version}/{resource}. Doesn't cover the "RFC 7807
  ProblemDetails for all errors" clause (that needs response-path analysis
  this engine doesn't perform).
severity: warning
enforcement:
  classification: deterministic
tags:
  - api
remediation: >
  Change the route template to /api/v{n}/{resource}.
illustrative: true

target:
  kind: call_site
  invoked_member: "Map*"

assertions:
  - must_match_argument:
      index: 0
      pattern: "^/api/v[0-9]+/"

tests:
  - name: Route mapped as /api/v{version}/{resource}
    setup:
      callSites:
        - invokedMember: MapGet
          arguments:
            - index: 0
              literalValue: "/api/v1/orders"
              isLiteral: true
    expect: pass

  - name: Route missing the /api prefix
    setup:
      callSites:
        - invokedMember: MapGet
          arguments:
            - index: 0
              literalValue: "/v1/orders"
              isLiteral: true
    expect: fail
versionFingerprint: sha256:e2b998474ff1bccb43389bc6348951a462cdae71c12121b861ef8d63105172cb
