id: CODING-API-XML-DOCS-PRESENT-001
name: XML documentation present on public APIs
description: >
  Public APIs carry XML documentation (summary/param/returns). Enforced by
  republishing the compiler's own CS1591 diagnostic ("missing XML comment for
  publicly visible type or member") as a rule violation, rather than
  reimplementing the check.
severity: info
enforcement:
  classification: deterministic
tags:
  - documentation
remediation: >
  Add a /// <summary> (and <param>/<returns> as applicable) XML doc comment
  to the public member.
illustrative: true

analyzer:
  kind: roslyn-diagnostic-passthrough
  diagnostic_ids:
    - "CS1591"
versionFingerprint: sha256:ed030f9bb8492f883a4a51ff6fcbdf76edb0c940db23abaec640dfed19b05648
