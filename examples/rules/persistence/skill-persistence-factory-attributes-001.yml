id: SKILL-PERSISTENCE-FACTORY-ATTRIBUTES-001
name: Persistence factory conventions
description: >
  Factory classes must carry [ExcludeFromCodeCoverage]. Doesn't cover "reads
  from entity.EntityData/EntityVersion, not from commands" or "event
  documents derived only from entity.NewEvents" (both need method-body
  data-flow analysis this rule doesn't perform).
severity: warning
enforcement:
  classification: deterministic
tags:
  - persistence
remediation: >
  Add [ExcludeFromCodeCoverage] to the factory class.
illustrative: true

target:
  kind: class
  namespace: "Contoso.Persistence.Factories"

assertions:
  - must_have_attribute:
      type: "ExcludeFromCodeCoverage"

tests:
  - name: Factory class carries ExcludeFromCodeCoverage
    setup:
      types:
        - name: OrderFactory
          namespace: Contoso.Persistence.Factories
          attributes:
            - typeName: ExcludeFromCodeCoverage
    expect: pass

  - name: Factory class missing ExcludeFromCodeCoverage
    setup:
      types:
        - name: OrderFactory
          namespace: Contoso.Persistence.Factories
    expect: fail
