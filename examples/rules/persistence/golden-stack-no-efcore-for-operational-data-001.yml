id: GOLDEN-STACK-NO-EFCORE-FOR-OPERATIONAL-DATA-001
name: No EF Core for operational data
description: >
  Core framework fixed: Cosmos SDK + DbUp for operational data. Persistence
  projects must not reference Microsoft.EntityFrameworkCore.
severity: error
enforcement:
  classification: deterministic
tags:
  - persistence
remediation: >
  Remove the Microsoft.EntityFrameworkCore* PackageReference and use the Cosmos
  SDK / Contoso.Framework.Reporting.DbUp stack instead.
illustrative: true

target:
  kind: project
  name: "*.Persistence"

assertions:
  - must_not_reference_package:
      id: "Microsoft.EntityFrameworkCore*"

tests:
  - name: Persistence project uses the Cosmos SDK for operational data
    setup:
      projects:
        - name: Contoso.Orders.Persistence
          packageReferences:
            - id: Microsoft.Azure.Cosmos
              version: "3.35.0"
    expect: pass

  - name: Persistence project references EF Core for operational data
    setup:
      projects:
        - name: Contoso.Orders.Persistence
          packageReferences:
            - id: Microsoft.EntityFrameworkCore.SqlServer
              version: "8.0.0"
    expect: fail
