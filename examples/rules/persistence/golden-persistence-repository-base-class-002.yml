id: GOLDEN-PERSISTENCE-REPOSITORY-BASE-CLASS-002
name: Repositories must not have pure delegation overrides
description: >
  Repository classes deriving from DomainEntityRepository<> must not declare
  a method whose body only calls base.<SameMethod>(...) with no added logic -
  such a wrapper adds nothing over inheriting the base implementation
  directly. Companion rule to GOLDEN-PERSISTENCE-REPOSITORY-BASE-CLASS-001
  (the inheritance clause).
severity: critical
enforcement:
  classification: deterministic
tags:
  - persistence
remediation: >
  Delete the override - the base class implementation already provides this
  behaviour.
illustrative: true

analyzer:
  kind: no-pure-delegation-override
  base_type_pattern: "*DomainEntityRepository*"
versionFingerprint: sha256:3556041facd2ccc7982f75e55889144b3cfa0fe0a6805e374e2336cd2ee58fa5
