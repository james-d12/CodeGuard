id: GOLDEN-PERSISTENCE-DBUP-SCRIPT-NAMING-001
name: DbUp script naming convention
description: >
  RunOnce scripts must be named {NNN}_{description}.sql and RunAlways scripts
  must be named {EntityName}_{Operation}.sql - no usp_/sp_ filename prefixes.
severity: warning
enforcement:
  classification: deterministic
tags:
  - persistence
  - dbup
remediation: >
  Rename the script to match RunOnce/{NNN}_{description}.sql or
  RunAlways/{EntityName}_{Operation}.sql as appropriate.
illustrative: true

target:
  kind: file
  extension: ".sql"

assertions:
  - must_match_name:
      regex: "^(.*/RunOnce/[0-9]{3}_.+\\.sql|.*/RunAlways/[A-Za-z]+_[A-Za-z]+\\.sql)$"

tests:
  - name: RunOnce script follows the numbered naming convention
    setup:
      files:
        - path: "Scripts/RunOnce/001_create_orders_table.sql"
    expect: pass

  - name: Script uses a forbidden usp_ filename prefix
    setup:
      files:
        - path: "Scripts/usp_CreateOrders.sql"
    expect: fail
