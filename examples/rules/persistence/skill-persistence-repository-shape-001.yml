id: SKILL-PERSISTENCE-REPOSITORY-SHAPE-001
name: Repository inherits DomainEntityRepository<>, sealed
description: >
  Repository classes must be sealed and derive from DomainEntityRepository<>.
  Doesn't cover "registered singleton" (call-site detection, covered instead
  by the registration-lifetime clause of
  SKILL-PERSISTENCE-REGISTRATION-SINGLETON-TIMEOUTS-001) or the
  "no single-argument VersionedEntityData<T> construction" clause (needs
  constructor-overload-at-call-site resolution this engine doesn't perform).
severity: error
enforcement:
  classification: deterministic
tags:
  - persistence
remediation: >
  Declare the repository class sealed and derive it from
  DomainEntityRepository<TEntity, TId>.
illustrative: true

target:
  kind: class
  namespace: "Contoso.Persistence.Repositories"

assertions:
  - must_have_modifier:
      modifier: "sealed"
  - must_inherit_from:
      type: "DomainEntityRepository<*>"

tests:
  - name: Repository is sealed and derives from DomainEntityRepository<>
    setup:
      types:
        - name: OrderRepository
          namespace: Contoso.Persistence.Repositories
          baseType: "DomainEntityRepository<Order, Guid>"
          modifiers: [sealed]
    expect: pass

  - name: Repository derives from base but is not sealed
    setup:
      types:
        - name: OrderRepository
          namespace: Contoso.Persistence.Repositories
          baseType: "DomainEntityRepository<Order, Guid>"
    expect: fail
