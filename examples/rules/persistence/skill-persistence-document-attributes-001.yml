id: SKILL-PERSISTENCE-DOCUMENT-ATTRIBUTES-001
name: Document partition key property is JsonIgnore
description: >
  A document's partition key property must carry [JsonIgnore]. Doesn't cover
  the Ttl-defaults-to--1 clause (needs a property initializer value fact not
  modeled) or the "no override on non-virtual base members" clause (needs a
  base-member-virtuality cross-check not modeled).
severity: error
enforcement:
  classification: deterministic
tags:
  - persistence
remediation: >
  Add [JsonIgnore] to the partition key property.
illustrative: true

target:
  kind: property
  namespace: "Contoso.Persistence.Documents"

when:
  must_match_name:
    regex: ".*PartitionKey$"

assertions:
  - must_have_attribute:
      type: "JsonIgnore"

tests:
  - name: Partition key property carries JsonIgnore
    setup:
      types:
        - name: OrderEntityDocument
          namespace: Contoso.Persistence.Documents
          properties:
            - name: PartitionKey
              attributes:
                - typeName: JsonIgnore
    expect: pass

  - name: Partition key property missing JsonIgnore
    setup:
      types:
        - name: OrderEntityDocument
          namespace: Contoso.Persistence.Documents
          properties:
            - name: PartitionKey
    expect: fail
