id: SKILL-REPORTING-EVENT-HANDLER-PROCESSOR-CALL-001
name: Reporting event handler calls processor directly
description: >
  Handlers must call the shared processor's ProcessAsync directly, not
  construct a bespoke *PersistenceProcessorInput wrapper class per handler.
  Doesn't cover the "shared MapEventRoute extension defined once and reused"
  cardinality clause.
severity: warning
enforcement:
  classification: deterministic
tags:
  - reporting
  - eventhandler
remediation: >
  Call the shared processor's ProcessAsync method instead of constructing a
  handler-specific input wrapper.
illustrative: true

target:
  kind: repository

assertions:
  - must_not_exist:
      selector:
        kind: call_site
        site_kind: object_creation
        invoked_member: "*PersistenceProcessorInput"
        project: "*.Reporting*"

tests:
  - name: Handler with no bespoke persistence processor input wrapper
    setup:
      callSites:
        - kind: invocation
          invokedMember: "ProcessAsync"
          project: Contoso.Reporting.Handlers
    expect: pass

  - name: Handler constructing a bespoke persistence processor input wrapper
    setup:
      callSites:
        - kind: object_creation
          invokedMember: "OrderPersistenceProcessorInput"
          project: Contoso.Reporting.Handlers
    expect: fail
