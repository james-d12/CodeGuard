id: SKILL-REPORTING-SCHEMAS-NO-REFS-001
name: Reporting.Schemas has zero NuGet/project references
description: >
  *.Reporting.Schemas projects carry pure data contracts and must have zero
  PackageReference and zero ProjectReference entries.
severity: error
enforcement:
  classification: deterministic
tags:
  - reporting
  - schemas
remediation: >
  Remove all PackageReference and ProjectReference entries from the
  *.Reporting.Schemas project.
illustrative: true

target:
  kind: project
  name: "*.Reporting.Schemas"

assertions:
  - must_not_reference_package:
      id: "*"
  - must_not_reference_project:
      name: "*"

tests:
  - name: Schemas project with no package or project references
    setup:
      projects:
        - name: Contoso.Reporting.Schemas
    expect: pass

  - name: Schemas project with a package reference
    setup:
      projects:
        - name: Contoso.Reporting.Schemas
          packageReferences:
            - id: Newtonsoft.Json
              version: "13.0.3"
    expect: fail
