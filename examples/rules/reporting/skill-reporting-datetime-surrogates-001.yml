id: SKILL-REPORTING-DATETIME-SURROGATES-001
name: Date/time surrogate helpers are static
description: >
  Date/time surrogate conversion helpers must be static (pure). Doesn't
  cover the yyyyMMdd/seconds-since-midnight value-format invariants (runtime
  data shape, not a static code fact) or "reverse conversion returns null
  rather than throwing" (needs return-statement analysis).
severity: warning
enforcement:
  classification: deterministic
tags:
  - reporting
remediation: >
  Declare the surrogate conversion helper as a static method.
illustrative: true

target:
  kind: method
  namespace: "Contoso.Reporting.*"
  name: "*Surrogate*"

assertions:
  - must_have_modifier:
      modifier: "static"

tests:
  - name: Static surrogate conversion helper
    setup:
      types:
        - name: DateHelpers
          namespace: Contoso.Reporting.Utils
          methods:
            - name: ToDateSurrogate
              modifiers: [static]
    expect: pass

  - name: Non-static surrogate conversion helper
    setup:
      types:
        - name: DateHelpers
          namespace: Contoso.Reporting.Utils
          methods:
            - name: ToDateSurrogate
    expect: fail
