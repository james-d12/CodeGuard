id: SKILL-REPORTING-HANDLER-SHAPE-001
name: Reporting handlers are sealed partial with HandleAsync
description: >
  Reporting handler classes must be sealed partial with a HandleAsync entry
  point. Doesn't verify the body delegates to ReportingSearchExecutor.ExecuteAsync
  (method-body inspection) or that DI registration uses AddScoped
  (call-site/registration-lifetime check).
severity: error
enforcement:
  classification: deterministic
tags:
  - reporting
remediation: >
  Declare the handler sealed partial class and expose a HandleAsync method
  that delegates to ReportingSearchExecutor.ExecuteAsync.
illustrative: true

target:
  kind: class
  namespace: "Contoso.Reporting.Application.Handlers"

assertions:
  - must_have_modifier:
      modifier: "sealed"
  - must_have_modifier:
      modifier: "partial"
  - must_have_method:
      name: "HandleAsync"

tests:
  - name: Sealed partial handler with a HandleAsync entry point
    setup:
      types:
        - name: OrderHandler
          namespace: Contoso.Reporting.Application.Handlers
          modifiers: [sealed, partial]
          methods:
            - name: HandleAsync
    expect: pass

  - name: Handler missing the partial modifier
    setup:
      types:
        - name: OrderHandler
          namespace: Contoso.Reporting.Application.Handlers
          modifiers: [sealed]
          methods:
            - name: HandleAsync
    expect: fail
