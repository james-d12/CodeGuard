id: SKILL-REPORTING-REQUIREMENTS-JSON-RULES-001
name: Reporting requirements.json DbUp deploymentType
description: >
  The DbUp component's deploymentType must be "job" in requirements.json.
  (The pre-app.json/base-app.json membership clauses need array-membership
  checks not yet available and are left for a future pass.)
severity: error
enforcement:
  classification: deterministic
tags:
  - reporting
  - infrastructure
remediation: >
  Set "deploymentType": "job" on the DbUp component entry in requirements.json.
illustrative: true

target:
  kind: file
  path: "*requirements.json"

assertions:
  - must_have_json_field:
      path: "dbup.deploymentType"
      equals: "job"
