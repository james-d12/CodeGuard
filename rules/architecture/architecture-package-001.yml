id: ARCH-PACKAGE-001
name: Domain projects must not reference Entity Framework Core directly
description: >
  Domain projects must remain persistence-ignorant; only Infrastructure projects
  may take a direct dependency on Microsoft.EntityFrameworkCore.
standard: ARCH-002
severity: error
enforcement:
  classification: deterministic
tags:
  - architecture
  - ddd
  - packages
remediation: >
  Remove the Microsoft.EntityFrameworkCore package reference from the Domain project.
illustrative: true

target:
  kind: project
  name: "*.Domain"

assertions:
  - must_not_reference_package:
      id: "Microsoft.EntityFrameworkCore"
