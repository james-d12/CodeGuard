id: SKILL-APPLICATION-NO-EFCORE-DBCONTEXT-001
name: Application layer is persistence-agnostic
description: >
  *.Application projects remain persistence-agnostic: no direct DbContext or
  Microsoft.EntityFrameworkCore references.
standard: .github/skills/application/index.md
severity: critical
enforcement:
  classification: deterministic
tags:
  - architecture
remediation: >
  Remove the Microsoft.EntityFrameworkCore* PackageReference and any direct
  DbContext usage from the Application project; depend on a repository
  abstraction instead.
illustrative: true

target:
  kind: project
  name: "*.Application"

assertions:
  - must_not_reference_package:
      id: "Microsoft.EntityFrameworkCore*"
  - must_not_depend_on:
      type: "Microsoft.EntityFrameworkCore.*"
