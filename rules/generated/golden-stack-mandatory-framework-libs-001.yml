id: GOLDEN-STACK-MANDATORY-FRAMEWORK-LIBS-001
name: Mandatory PayPoint framework libraries
description: >
  Application projects must reference the mandatory PayPoint framework
  libraries for logging, instrumentation, health checks, and HTTP.
standard: standards/golden-standard.md#14-technology-stack
severity: warning
enforcement:
  classification: deterministic
tags:
  - packages
remediation: >
  Add the missing PP.Framework.* package reference.
illustrative: true

target:
  kind: project
  name: "*.Application"

assertions:
  - must_reference_package:
      id: "PP.Framework.Logging.Microsoft"
  - must_reference_package:
      id: "PP.Framework.Instrumentation"
  - must_reference_package:
      id: "PP.Framework.HealthChecks"
  - must_reference_package:
      id: "PP.Framework.Http"
