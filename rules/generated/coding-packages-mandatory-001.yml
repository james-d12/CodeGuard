id: CODING-PACKAGES-MANDATORY-001
name: Mandatory NuGet packages present in API projects
description: >
  PP.Framework.DDD.v2, PP.Framework.Http, Microsoft.AspNetCore.App,
  Microsoft.Extensions.* referenced as applicable per project role.
  Approximated here against *.Api projects only; other project roles have
  different required package sets not covered by this single rule.
standard: standards/coding-standards.md#nuget-package-policy
severity: warning
enforcement:
  classification: deterministic
tags:
  - packages
remediation: >
  Add the missing PackageReference to the project's .csproj.
illustrative: true

target:
  kind: project
  name: "*.Api"

assertions:
  - must_reference_package:
      id: "Microsoft.AspNetCore.App"
  - must_reference_package:
      id: "PP.Framework.Http"
