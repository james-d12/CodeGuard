id: SKILL-OBSERVABILITY-NO-CLIENT-KEY-METRIC-TAG-001
name: client_key forbidden as a metric tag
description: >
  client_key must never be used as a metric tag (a high-cardinality value);
  use client_sector grouping instead. Approximated as a source-text scan for
  the literal tag name, since named-argument values aren't captured by this
  engine's call-site model.
severity: critical
enforcement:
  classification: deterministic
tags:
  - telemetry
  - cardinality
remediation: >
  Replace the client_key metric tag with client_sector.
illustrative: true

target:
  kind: file
  extension: ".cs"

assertions:
  - must_not_match_content:
      pattern: "\"client_key\"|\"clientKey\""
