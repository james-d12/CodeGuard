id: SKILL-REPORTING-PERSISTENCE-PROCESSOR-BASE-001
name: Mandatory ReportingPersistenceProcessorBase derivation
description: >
  Persistence processor classes must derive from
  ReportingPersistenceProcessorBase<TModel> rather than implementing their
  own try/catch/retry classification logic.
standard: .github/skills/reporting/pps-reporting-persistence-processor/SKILL.md
severity: error
enforcement:
  classification: deterministic
tags:
  - reporting
  - persistence
remediation: >
  Derive the processor class from ReportingPersistenceProcessorBase<TModel>
  instead of hand-rolling retry/error classification.
illustrative: true

target:
  kind: class
  namespace: "Contoso.Reporting.Persistence"

assertions:
  - must_inherit_from:
      type: "ReportingPersistenceProcessorBase<*>"
