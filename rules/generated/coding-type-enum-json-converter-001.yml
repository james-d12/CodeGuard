id: CODING-TYPE-ENUM-JSON-CONVERTER-001
name: API-facing enums use JsonStringEnumConverter
description: >
  Enums exposed via API use [JsonConverter(typeof(JsonStringEnumConverter))];
  default/unknown value starts at 0. The first-member-value=0 clause is not
  covered by this rule (requires enum member value inspection not modeled
  in a single declarative assertion).
standard: standards/coding-standards.md#type-design
severity: warning
enforcement:
  classification: deterministic
tags:
  - api
  - enums
remediation: >
  Add [JsonConverter(typeof(JsonStringEnumConverter))] to the enum declaration.
illustrative: true

target:
  kind: enum
  namespace: "Contoso.*"

assertions:
  - must_have_attribute:
      type: "*.JsonConverterAttribute"
