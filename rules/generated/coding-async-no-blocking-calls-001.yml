id: CODING-ASYNC-NO-BLOCKING-CALLS-001
name: No blocking async calls
description: >
  No .Result or .Wait() call sites on Task/Task<T> anywhere in the
  repository. Doesn't cover the "no async void outside designated
  event-handler signatures" clause (that needs a method-signature/attribute
  cross-check this rule doesn't perform).
severity: error
enforcement:
  classification: deterministic
tags:
  - async
remediation: >
  Replace `.Result`/`.Wait()` with `await`.
illustrative: true

target:
  kind: repository

assertions:
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "Result"
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "Wait"
