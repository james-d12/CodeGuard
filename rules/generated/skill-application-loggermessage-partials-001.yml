id: SKILL-APPLICATION-LOGGERMESSAGE-PARTIALS-001
name: Structured logs use LoggerMessage partials
description: >
  Structured logs must use [LoggerMessage] source-generated partial methods,
  not ad hoc logger.LogInformation/LogWarning/LogError interpolation.
standard: .github/skills/application/index.md
severity: warning
enforcement:
  classification: deterministic
tags:
  - logging
remediation: >
  Replace the direct logger.Log*(...) call with a [LoggerMessage] partial
  method.
illustrative: true

target:
  kind: repository

assertions:
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "LogInformation"
        project: "*.Application*"
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "LogWarning"
        project: "*.Application*"
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "LogError"
        project: "*.Application*"
