id: CODING-TEST-NAMING-CONVENTION-001
name: Test naming convention
description: >
  Test methods named MethodName_Scenario_ExpectedBehavior.
severity: warning
enforcement:
  classification: deterministic
tags:
  - testing
  - naming
remediation: >
  Rename the test method to MethodName_Scenario_ExpectedBehavior.
illustrative: true

target:
  kind: method
  project: "*.Tests"

assertions:
  - must_match_name:
      regex: "^[A-Za-z0-9]+_[A-Za-z0-9]+_[A-Za-z0-9]+$"
