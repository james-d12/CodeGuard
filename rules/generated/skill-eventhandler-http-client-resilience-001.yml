id: SKILL-EVENTHANDLER-HTTP-CLIENT-RESILIENCE-001
name: EventHandler HTTP client uses IHttpRequestSender with resilience policies
description: >
  EventHandler outbound HTTP calls must use IHttpRequestSender/
  HttpRequestBuilder, never raw HttpClient. Doesn't verify the mandatory
  retry+circuit-breaker policy configuration (fluent-chain argument analysis
  this rule doesn't perform).
severity: error
enforcement:
  classification: deterministic
tags:
  - eventhandler
  - http
remediation: >
  Replace the raw HttpClient with an IHttpRequestSender/HttpRequestBuilder
  typed client configured with retry and circuit-breaker policies.
illustrative: true

target:
  kind: repository

assertions:
  - must_not_exist:
      selector:
        kind: call_site
        site_kind: object_creation
        invoked_member: "HttpClient"
        project: "*.EventHandler*"
