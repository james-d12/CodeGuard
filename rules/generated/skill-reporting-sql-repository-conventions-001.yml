id: SKILL-REPORTING-SQL-REPOSITORY-CONVENTIONS-001
name: Reporting SQL repository conventions
description: >
  Reporting SQL repositories must log via LogDebug before execution and use
  the async IsDBNullAsync check, never the synchronous IsDBNull. Approximated
  as "the calls exist/don't exist somewhere in the repository" rather than
  verifying every method individually, and doesn't cover the "one stored
  procedure per method" 1:1 naming clause.
standard: .github/skills/reporting/pps-reporting-sql-repository/SKILL.md
severity: warning
enforcement:
  classification: deterministic
tags:
  - reporting
  - sql
remediation: >
  Add a LogDebug call with structured parameters before execution, and
  replace IsDBNull with IsDBNullAsync.
illustrative: true

target:
  kind: repository

assertions:
  - must_exist:
      selector:
        kind: call_site
        invoked_member: "LogDebug"
        project: "*.Reporting*"
  - must_not_exist:
      selector:
        kind: call_site
        invoked_member: "IsDBNull"
        project: "*.Reporting*"
