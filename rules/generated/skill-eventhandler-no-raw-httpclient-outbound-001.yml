id: SKILL-EVENTHANDLER-NO-RAW-HTTPCLIENT-OUTBOUND-001
name: EventHandler outbound calls use typed adapters
description: >
  Outbound calls from EventHandler application adapters must use typed
  adapters + PP.Framework.Http abstractions, never raw HttpClient.
severity: error
enforcement:
  classification: deterministic
tags:
  - eventhandler
  - http
remediation: >
  Replace the raw HttpClient with a typed adapter using
  PP.Framework.Http abstractions.
illustrative: true

target:
  kind: repository

assertions:
  - must_not_exist:
      selector:
        kind: call_site
        site_kind: object_creation
        invoked_member: "HttpClient"
        project: "*.EventHandler.Application*"
