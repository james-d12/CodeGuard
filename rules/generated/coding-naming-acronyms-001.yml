id: CODING-NAMING-ACRONYMS-001
name: Acronym casing convention
description: >
  Two-letter acronyms (Id, Db, Ui) are treated as a single word; longer
  acronyms are PascalCase, not all-caps (e.g. Http, not HTTP). Approximated
  here against class names in Contoso.* namespaces; the full rule also
  applies to methods, properties, and fields.
standard: standards/coding-standards.md#naming-conventions
severity: info
enforcement:
  classification: deterministic
tags:
  - naming
remediation: >
  Rename the identifier so acronyms follow PascalCase (Http, Id, Url), not
  all-caps runs (HTTP, ID, URL).
illustrative: true

target:
  kind: class
  namespace: "Contoso.*"

assertions:
  - must_match_name:
      regex: "^(?!.*[A-Z]{2,}).+$"
