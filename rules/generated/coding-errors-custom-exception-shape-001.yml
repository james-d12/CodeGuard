id: CODING-ERRORS-CUSTOM-EXCEPTION-SHAPE-001
name: Custom exceptions follow standard shape
description: >
  Types named *Exception must derive from System.Exception (or a subclass)
  and declare the 3 standard constructor overloads: parameterless,
  (string message), and (string message, Exception innerException).
standard: standards/coding-standards.md#error-handling
severity: warning
enforcement:
  classification: deterministic
tags:
  - exceptions
remediation: >
  Add the missing constructor overload(s) and/or derive from
  System.Exception (or a subclass).
illustrative: true

target:
  kind: type

when:
  must_match_name:
    regex: ".*Exception$"

assertions:
  - must_inherit_from:
      type: "*Exception*"
  - must_exist:
      selector:
        kind: constructor
        declaring_type: "${FullName}"
        parameter_types: []
  - must_exist:
      selector:
        kind: constructor
        declaring_type: "${FullName}"
        parameter_types: ["string"]
  - must_exist:
      selector:
        kind: constructor
        declaring_type: "${FullName}"
        parameter_types: ["string", "Exception"]
