id: GOLDEN-ARCH-EVENT-STRUCTURE-001
name: Concrete event records are sealed
description: >
  Concrete event records deriving from the shared event base record must be
  `sealed`. The companion clause ("base record declares Audit and Version
  members") is not covered by this rule, since it targets a different type
  (the base record, not its derivatives) and would need a second rule
  targeting Contoso.Domain.Events.EventBase directly.
severity: warning
enforcement:
  classification: deterministic
tags:
  - events
remediation: >
  Add the `sealed` modifier to the concrete event record.
illustrative: true

target:
  kind: inherits_from
  type: "Contoso.Domain.Events.EventBase"

assertions:
  - must_have_modifier:
      modifier: "sealed"
