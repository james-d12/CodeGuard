id: SKILL-DOMAIN-EVENT-MAPPING-EXHAUSTIVE-001
name: CreateEventData switch must be exhaustive
description: >
  CreateEventData's switch over event types must have a default or discard
  arm - this engine can't prove exhaustiveness against the switch's governing
  type from static facts alone, so a missing fallback arm means new event
  types can silently go unhandled. Doesn't verify that every arm sets
  Audit/Version = EntityVersion (that needs per-arm construction analysis
  beyond what this analyzer performs).
standard: .github/skills/domain/pps-domain-event-mapping/SKILL.md
severity: error
enforcement:
  classification: deterministic
tags:
  - domain
  - events
remediation: >
  Add a default (or discard `_`) arm to the switch, typically throwing
  ArgumentOutOfRangeException for the unmapped case.
illustrative: true

analyzer:
  kind: exhaustive-switch
  namespace: "Contoso.Domain.*"
