id: CODING-NAMING-CAPITALIZATION-TABLE-001
name: Class capitalization convention
description: >
  Namespace/Class/Method/Property/PublicField/Constant/EnumType/EnumValue use
  PascalCase; Interface uses IPascalCase; PrivateField uses _camelCase;
  Parameter/LocalVariable use camelCase. Approximated here against class
  names only (PascalCase); locals, parameters, and other declared-symbol
  kinds are not covered by this single rule.
standard: standards/coding-standards.md#naming-conventions
severity: warning
enforcement:
  classification: deterministic
tags:
  - naming
remediation: >
  Rename the class to PascalCase.
illustrative: true

target:
  kind: class
  namespace: "Contoso.*"

assertions:
  - must_match_name:
      regex: "^[A-Z][A-Za-z0-9]*$"
