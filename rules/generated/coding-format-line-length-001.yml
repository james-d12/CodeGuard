id: CODING-FORMAT-LINE-LENGTH-001
name: Prefer lines under 120 characters
description: >
  Source lines should not exceed 120 characters.
standard: standards/coding-standards.md#code-style-and-formatting
severity: info
enforcement:
  classification: deterministic
tags:
  - formatting
remediation: >
  Wrap or shorten the offending line to stay under 120 characters.
illustrative: true

target:
  kind: file
  extension: ".cs"

assertions:
  - must_not_match_content:
      pattern: "(?m)^.{121,}$"
