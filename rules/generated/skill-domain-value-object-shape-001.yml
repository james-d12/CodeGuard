id: SKILL-DOMAIN-VALUE-OBJECT-SHAPE-001
name: Value objects are sealed records
description: >
  Value objects must be sealed record. Doesn't cover "no mutable set
  properties" (a property-level check with no target selector here), "no
  exceptions thrown from factories" (needs return-statement analysis), or
  "no persistence ID property" (needs a property-absence check by name) -
  each would need its own rule targeting the property level.
severity: error
enforcement:
  classification: deterministic
tags:
  - domain
  - value-objects
remediation: >
  Declare the value object as `public sealed record`.
illustrative: true

target:
  kind: record
  namespace: "Contoso.Domain.ValueObjects"

assertions:
  - must_have_modifier:
      modifier: "sealed"
