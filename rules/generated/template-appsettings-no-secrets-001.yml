id: TEMPLATE-APPSETTINGS-NO-SECRETS-001
name: Scaffolded appsettings.json has no secrets
description: >
  Generated appsettings.json stubs must contain no ConnectionStrings section
  or secret-shaped values.
standard: standards/template-extraction.md
severity: error
enforcement:
  classification: deterministic
tags:
  - scaffolding
  - secrets
remediation: >
  Remove the ConnectionStrings section and any secret-shaped values from the
  scaffolded appsettings.json; use user-secrets or a vault reference instead.
illustrative: true

target:
  kind: file
  path: "*appsettings.json"

assertions:
  - must_not_have_json_field:
      path: "ConnectionStrings"
  - must_not_match_content:
      pattern: "(?i)\"(password|secret|apikey)\"\\s*:"
