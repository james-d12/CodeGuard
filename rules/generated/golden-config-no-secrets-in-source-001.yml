id: GOLDEN-CONFIG-NO-SECRETS-IN-SOURCE-001
name: No secrets committed to source control
description: >
  Tracked files, especially under requirements/, must not contain credential-shaped
  values such as AWS access keys, private key blocks, or inline password assignments.
standard: standards/golden-standard.md#7-configuration-and-secrets
severity: critical
enforcement:
  classification: deterministic
tags:
  - security
  - secrets
remediation: >
  Remove the credential value from source control and load it from a secret store
  (e.g. Key Vault) or user-secrets/environment variable instead.
illustrative: true

target:
  kind: file
  path: "requirements/*"

assertions:
  - must_not_match_content:
      pattern: "(?i)(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |)PRIVATE KEY-----|password\\s*=\\s*[^;\\s\"]{4,})"
