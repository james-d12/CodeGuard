id: SKILL-APPHOST-NO-HARDCODED-SECRETS-001
name: AppHost secrets never hardcoded
description: >
  Secrets must never be hardcoded in AppHost configuration; secret
  parameters must be declared via AddParameter(..., secret: true).
standard: .github/skills/aspire/pps-apphost-configuration/SKILL.md
severity: critical
enforcement:
  classification: deterministic
tags:
  - aspire
  - secrets
remediation: >
  Replace the hardcoded literal with builder.AddParameter("name", secret: true).
illustrative: true

target:
  kind: file
  path: "*.AppHost/*"
  extension: ".cs"

assertions:
  - must_not_match_content:
      pattern: "(?i)(password|secret|apikey|connectionstring)\\s*=\\s*\"[^\"]{4,}\""
