id: GOLDEN-ARCH-EVENT-NAMING-001
name: Event naming convention
description: >
  Events named {Entity}{Action}Event.
standard: standards/golden-standard.md#2-core-architecture-patterns
severity: warning
enforcement:
  classification: deterministic
tags:
  - naming
  - events
remediation: >
  Rename the event record so it ends with "Event" (e.g. OrderPlacedEvent).
illustrative: true

target:
  kind: record
  namespace: "Contoso.Domain.Events"

assertions:
  - must_match_name:
      regex: "^[A-Za-z]+Event$"
