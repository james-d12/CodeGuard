id: GOLDEN-REPO-ROOT-FILES-001
name: Mandatory root files
description: >
  The repository root must contain azure-pipelines.yaml, azure-pipelines-pr.yaml,
  .editorconfig, .gitignore, and README.md.
standard: standards/golden-standard.md#1-repository-structure
severity: error
enforcement:
  classification: deterministic
tags:
  - structure
remediation: >
  Add the missing root file.
illustrative: true

target:
  kind: repository

assertions:
  - must_have_file:
      path: "azure-pipelines.yaml"
  - must_have_file:
      path: "azure-pipelines-pr.yaml"
  - must_have_file:
      path: ".editorconfig"
  - must_have_file:
      path: ".gitignore"
  - must_have_file:
      path: "README.md"
