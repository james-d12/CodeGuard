id: CODING-NAMING-ASYNC-SUFFIX-001
name: Async methods suffixed Async
description: >
  All methods declared `async` must be suffixed with Async.
standard: standards/coding-standards.md#naming-conventions
severity: warning
enforcement:
  classification: deterministic
tags:
  - naming
  - async
remediation: >
  Rename the method to end with "Async".
illustrative: true

target:
  kind: method
  namespace: "Contoso.*"
  is_async: true

assertions:
  - must_match_name:
      regex: "Async$"
